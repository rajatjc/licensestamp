[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "licensestamp"
dynamic = ["version"]
description = "Add and update SPDX license headers in source files, dated from git history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rajat Sharma" }]
requires-python = ">=3.11"
keywords = ["license", "header", "spdx", "copyright", "pre-commit", "reuse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rajatjc/licensestamp"
Issues = "https://github.com/rajatjc/licensestamp/issues"

[project.scripts]
licensestamp = "licensestamp.cli:main"

[tool.setuptools_scm]
# pre-commit installs from a shallow clone, where the version tag may not be visible.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
