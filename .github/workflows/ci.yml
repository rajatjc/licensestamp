name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from tags, and the header check dates files from history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - run: pytest
      - name: Every file in this repo has its own license header
        run: licensestamp --check .

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npx -y -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@10.4.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the tag semantic-release just made
        id: tag
        run: |
          git fetch --tags --force
          echo "tag=$(git tag --points-at HEAD 'v*' | head -n1)" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - if: steps.tag.outputs.tag != ''
        run: pipx run build
      - if: steps.tag.outputs.tag != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
